name: imagen
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'anim/**', 'herramientas/**', '.github/workflows/imagen.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Liberar disco del runner (la imagen pesa ~15–20 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pod-video:latest
            ghcr.io/${{ github.repository_owner }}/pod-video:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pod de video (Remotion, ffmpeg, Blender, ComfyUI, audio) para RunPod
      - run: df -h /
